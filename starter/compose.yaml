name: citetrace
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: citetrace
      POSTGRES_USER: citetrace
      POSTGRES_PASSWORD: citetrace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citetrace -d citetrace"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../contracts/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
  grobid:
    image: grobid/grobid:0.9.1-crf
    init: true
    ulimits:
      core: 0
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8070/api/isalive || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
  api:
    build:
      context: ./services/api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_healthy
    profiles: [application]
  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_CITETRACE_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: [application]
volumes:
  postgres-data:
  redis-data:
