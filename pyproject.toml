# Workspace marker only.
#
# The shipped Python package is `citetrace-api` defined in
# starter/services/api/pyproject.toml. The root directory holds
# design artifacts (docs/, contracts/, prompts/, eval/, scripts/,
# starter/) and is intentionally not installable as a Python
# package.
#
# To work on the API:
#   cd starter/services/api
#   uv sync
#   uv run pytest
#
# To run the cross-package validators:
#   uv run --with pydantic --with pyyaml python scripts/validate_package.py
#   uv run --with pyyaml python scripts/validate_eval_assets.py
#
# A previous version of this file declared a `citetrace` console
# script and an `src/citetrace/` stub package. Both were removed in
# ADR-0008 Slice 1: the stub was not imported anywhere and the
# console script printed "Hello from citetrace!", which is not
# what a research-reading CLI should do on startup.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
