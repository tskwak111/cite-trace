[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citetrace-api"
version = "0.1.0"
description = "CiteTrace evidence-first API foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "uvicorn[standard]>=0.35,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "boto3>=1.40,<2",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "anyio[asyncio]>=4.8,<5",
  "pytest-anyio>=0.0.0,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
anyio_mode = "asyncio"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
