version: 1.0.0
secrets:
  database-url:
    description: PostgreSQL connection string for the primary database.
    rotation_days: 90
    owner: platform
    access_logging: required
    min_audit_retention_days: 365
  redis-url:
    description: Redis connection string for the queue and ephemeral state.
    rotation_days: 90
    owner: platform
    access_logging: required
    min_audit_retention_days: 365
  model-provider-api-key:
    description: API key for the LLM provider configured in model-routing.yaml.
    rotation_days: 30
    owner: model-platform
    access_logging: required
    min_audit_retention_days: 730
    notes: |
      Keys must be rotated on a 30-day cadence even when the provider
      does not require it. The rotation is enforced by a CI check
      that fails the release if the key age exceeds the threshold.
  sentry-dsn:
    description: Sentry project DSN for client-side error reporting.
    rotation_days: 365
    owner: observability
    optional: true
  grobid-shared-secret:
    description: Shared secret the API uses to authenticate to the GROBID service.
    rotation_days: 90
    owner: platform
    access_logging: required
    min_audit_retention_days: 365
  tenant-encryption-key:
    description: KMS key used for at-rest encryption of tenant-private assets.
    rotation_days: 365
    owner: security
    access_logging: required
    min_audit_retention_days: 2555
    notes: |
      Rotation triggers a re-encryption of all tenant data; the
      rotation window is scheduled in the maintenance window and
      is treated as a release.

boundaries:
  application_never_persists_secrets_to_disk:
    - "The application process is forbidden from writing secret values to
       /var/log, /tmp, or any local file. The secret-redaction middleware
       (see `citetrace_api.observability.log_redaction`) replaces the
       value with a SHA-256 prefix before the log line is written."
  application_never_sends_secrets_to_observability:
    - "Secret values are stripped from OpenTelemetry span attributes by
       the OTel collector (`ops/observability/otel-collector.yaml`).
       Any attribute whose key matches `*.secret`, `*.password`, or
       `*.token` is removed before the span is exported."
  application_never_embeds_secrets_in_user_facing_strings:
    - "The share-link service and the evidence export service emit
       short-lived signed URLs that contain a token, not a secret.
       The token hash is logged, never the token."
