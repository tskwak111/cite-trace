apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: citetrace
  labels:
    app: citetrace-worker
    tier: backend
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: citetrace-worker
      tier: backend
  template:
    metadata:
      labels:
        app: citetrace-worker
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: citetrace-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        runAsGroup: 10003
        fsGroup: 10003
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: citetrace/worker:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "citetrace_api.orchestration.worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: citetrace-api
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: citetrace-api
                  key: redis-url
            - name: GROBID_URL
              valueFrom:
                configMapKeyRef:
                  name: citetrace-config
                  key: grobid-url
            - name: MODEL_ROUTING_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: citetrace-config
                  key: model-routing.yaml
          ports:
            - name: metrics
              containerPort: 8001
              protocol: TCP
          resources:
            requests:
              cpu: 750m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 2.5Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: citetrace-worker
              tier: backend
