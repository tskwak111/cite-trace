name: citetrace-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package validators
        run: python -m pip install jsonschema pyyaml openapi-spec-validator
      - name: Validate package contracts
        run: python scripts/validate_package.py
      - name: Install API
        run: python -m pip install -e 'starter/services/api[dev]'
      - name: Lint API
        run: ruff check starter/services/api/src starter/services/api/tests
      - name: Type-check API
        run: mypy starter/services/api/src
      - name: Test API
        run: pytest -q starter/services/api/tests
      - name: Test ops contracts
        run: pytest -q starter/ops/tests
      - name: Gold-set preflight (continues even when below minimum)
        run: |
          set +e
          python scripts/build_goldset.py preflight --gold eval/sample_cases.jsonl
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::notice::gold set meets the release minimum"
          else
            echo "::warning::gold set below release minimum; the release gate is synthetic-only until this passes"
          fi
  grobid-smoke:
    runs-on: ubuntu-latest
    services:
      grobid:
        image: grobid/grobid:0.9.1-crf
        ports:
          - 8070:8070
        options: >-
          --health-cmd "wget -qO- http://localhost:8070/api/isalive || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API
        run: python -m pip install -e 'starter/services/api[dev]'
      - name: Wait for GROBID
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8070/api/isalive | grep -qi true; then
              echo "GROBID ready"
              break
            fi
            sleep 5
          done
      - name: Run GROBID smoke
        env:
          CITETRACE_GROBID_URL: http://localhost:8070
        run: pytest -q starter/services/api/tests/test_grobid_live_smoke.py
      - name: Run GROBID robustness
        env:
          CITETRACE_GROBID_URL: http://localhost:8070
        run: pytest -q starter/services/api/tests/test_grobid_robustness.py
  pgvector-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: citetrace
          POSTGRES_USER: citetrace
          POSTGRES_PASSWORD: citetrace
        ports:
          - 55445:5432
        options: >-
          --health-cmd "pg_isready -U citetrace -d citetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API
        run: python -m pip install -e 'starter/services/api[dev]'
      - name: Wait for pgvector
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=citetrace psql -h localhost -p 55445 -U citetrace -d citetrace -c 'SELECT 1' >/dev/null 2>&1; then
              echo "pgvector ready"
              break
            fi
            sleep 2
          done
      - name: Apply schema
        run: PGPASSWORD=citetrace psql -h localhost -p 55445 -U citetrace -d citetrace -v ON_ERROR_STOP=1 -f contracts/db/schema.sql
      - name: Run pgvector smoke
        env:
          CITETRACE_PGVECTOR_URL: postgresql://citetrace:citetrace@localhost:55445/citetrace
        run: pytest -q starter/services/api/tests/test_pgvector_search.py
      - name: Run live blocking-metric collector smoke
        env:
          CITETRACE_DATABASE_URL: postgresql://citetrace:citetrace@localhost:55445/citetrace
        run: pytest -q starter/services/api/tests/test_live_blocking_metrics.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install web dependencies
        run: pnpm --dir starter/apps/web install --no-frozen-lockfile
      - name: Type-check web
        run: pnpm --dir starter/apps/web typecheck
      - name: Build web
        run: pnpm --dir starter/apps/web build
