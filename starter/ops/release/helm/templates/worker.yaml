{{/*
  CiteTrace worker deployment.
  See templates/api.yaml for the contract comment.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.worker.name }}
    tier: backend
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.worker.name }}
      tier: backend
  template:
    metadata:
      labels:
        app: {{ .Values.worker.name }}
        tier: backend
    spec:
      serviceAccountName: {{ .Values.worker.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        fsGroup: 10003
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["python", "-m", "citetrace_api.orchestration.worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseUrl.secretKeyRef.name }}
                  key: {{ .Values.secrets.databaseUrl.secretKeyRef.key }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redisUrl.secretKeyRef.name }}
                  key: {{ .Values.secrets.redisUrl.secretKeyRef.key }}
          ports:
            - name: metrics
              containerPort: 8001
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu }}
              memory: {{ .Values.worker.resources.requests.memory }}
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu }}
              memory: {{ .Values.worker.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
